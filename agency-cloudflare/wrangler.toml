name = "jarvis-cf"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ⚠️ لا تضع أي مفاتيح/توكنات هنا — Secrets تُضاف عبر: npx wrangler secret put
#
# 1) أنشئ مخزن الذاكرة (مجاني):
#      npx wrangler kv namespace create JARVIS_KV
# 2) الصق الـ id الناتج هنا بدل العبارة التالية:
[[kv_namespaces]]
binding = "JARVIS_KV"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# موجز صباحي مجدول كل يوم 06:00 UTC (≈ 07:00–08:00 بتوقيت أمستردام حسب التوقيت الصيفي)
# مجاني بالكامل ضمن Workers Free. لإيقافه احذف هذا القسم فقط.
[triggers]
crons = ["0 6 * * *"]
