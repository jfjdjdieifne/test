# ===== جسر LMArena (اختياري) =====
# شغّل الخدمة من مجلد arena-bridge/ (Python + gpt4free/Arena + LMArenaBridge المحلي)
# ثم اضبط القيم هنا أو (الأفضل للأمان) عبر:
#   npx wrangler secret put ARENA_BRIDGE_URL
#   npx wrangler secret put ARENA_BRIDGE_KEY
# ملاحظة: الرابط بدون /v1 في النهاية — جارفس يضيف /v1/chat/completions بنفسه.
# ARENA_BRIDGE_URL = "https://arena-bridge.example.com"
# ARENA_BRIDGE_KEY = ""            # نفس BRIDGE_API_KEY بملف arena-bridge/.env
# ARENA_BRIDGE_MODEL = "auto"
# Arena أساسي تلقائياً بمجرد ضبط ARENA_BRIDGE_URL (وباقي المزودين احتياط).
# ARENA_BRIDGE_FIRST = "false"     # بدك ترجّع Gemini أول؟ حط false
# ARENA_BRIDGE_COOLDOWN_MS = "300000"  # مدة تجاهل الجسر بعد فشل متكرر
# ARENA_BRIDGE_TIMEOUT_MS = "45000"

[[kv_namespaces]]
binding = "JARVIS_KV"
id = "1bb9b81dde75449998d5afa33ded0302"

# Workers AI — ذكاء اصطناعي مجاني تاعي Cloudflare يتجدد يومياً (بدون مفتاح)
[ai]
binding = "AI"
