name = "jarvis-24-7"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Chromium مُدار من Cloudflare — يشغّل Arena مباشرة بلا Hugging Face/Render.
[browser]
binding = "BROWSER"

# =====================================================
# الذاكرة (KV) تُربط من لوحة Cloudflare — لا تُكتب هنا:
#   Workers & Pages → jarvis-cf → Settings → Bindings
#   → Add binding → KV namespace
#   Variable name: JARVIS_KV   |   Namespace: JARVIS_KV
# =====================================================
# (اختياري) إن أردت الربط من هنا بدلاً من اللوحة، احذف علامات # بالبسطة التالية
# وضع الـ id الفعلي الذي يظهر عند: Workers & Pages → KV
# [[kv_namespaces]]
# binding = "JARVIS_KV"
# id = "<PUT-YOUR-KV-NAMESPACE-ID-HERE>"

# جدولة تلقائية كل دقيقة: الموجز الصباحي (~06:00 UTC) + طابور المهام الطويلة
[triggers]
crons = ["* * * * *"]

