name = "jarvis-24-7"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Chromium مُدار من Cloudflare — يشغّل Arena مباشرة بلا Hugging Face/Render.
[browser]
binding = "BROWSER"

# =====================================================
# الذاكرة (KV) تُربط من لوحة Cloudflare — لا تُكتب هنا:
#   Workers & Pages → jarvis-cf → Settings → Bindings
#   → Add binding → KV namespace
#   Variable name: JARVIS_KV   |   Namespace: JARVIS_KV
# =====================================================
# (اختياري) إن أردت الربط من هنا بدلاً من اللوحة، احذف علامات # بالبسطة التالية
# وضع الـ id الفعلي الذي يظهر عند: Workers & Pages → KV
# [[kv_namespaces]]
# binding = "JARVIS_KV"
# id = "<PUT-YOUR-KV-NAMESPACE-ID-HERE>"

# جدولة تلقائية كل دقيقة: الموجز الصباحي (~06:00 UTC) + طابور المهام الطويلة
[triggers]
crons = ["* * * * *"]

# ===== المتغيرات (⚠️ المستودع عام — القيم تحت placeholders) =====
# ⚠️ الأسرار ما بتنكتب هون — المستودع عام.
# استخدم: npx wrangler secret put NAME  (ثم wrangler deploy)

[vars]
TELEGRAM_BOT_TOKEN = "PUT_NEW_BOT_TOKEN_HERE"  # الانكشف 2026-11-14 — لا تستخدمه أبدًا
ALLOWED_TELEGRAM_ID = "8347000859"
GEMINI_API_KEY = "PUT_NEW_GEMINI_KEY_HERE"  # الانكشف 2026-11-14 — لا تستخدمه أبدًا
OPENROUTER_API_KEY = "PUT_NEW_OPENROUTER_KEY_HERE"  # الانكشف 2026-11-14 — لا تستخدمه أبدًا
TAVILY_API_KEY = "PUT_NEW_TAVILY_KEY_HERE"  # الانكشف 2026-11-14 — لا تستخدمه أبدًا
CALLMEBOT_TELEGRAM_USER = "actian_data"
WEBHOOK_SECRET = "PUT_NEW_WEBHOOK_SECRET_HERE"
CALL_SECRET = "PUT_NEW_CALL_SECRET_HERE"
CALL_ON_BRIEF = "true"
# Arena هو العقل الوحيد للردود؛ محركات STT/TTS تبقى أدوات صوت لا عقول بديلة.
ARENA_ONLY = "true"

# ===== جسر LMArena (اختياري) =====
# شغّل الخدمة من مجلد arena-bridge/ (Python + gpt4free/Arena + LMArenaBridge المحلي)
# ثم اضبط القيم هنا أو (الأفضل للأمان) عبر:
#   npx wrangler secret put ARENA_BRIDGE_URL
#   npx wrangler secret put ARENA_BRIDGE_KEY
# ملاحظة: الرابط بدون /v1 في النهاية — جارفس يضيف /v1/chat/completions بنفسه.
# ARENA_BRIDGE_URL = "https://arena-bridge.example.com"
# ARENA_BRIDGE_KEY = ""            # نفس BRIDGE_API_KEY بملف arena-bridge/.env
# ARENA_BRIDGE_MODEL = "auto"
# Arena أساسي تلقائياً بمجرد ضبط ARENA_BRIDGE_URL (وباقي المزودين احتياط).
# ARENA_BRIDGE_FIRST = "false"     # بدك ترجّع Gemini أول؟ حط false
# ARENA_BRIDGE_COOLDOWN_MS = "300000"  # مدة تجاهل الجسر بعد فشل متكرر
# ARENA_BRIDGE_TIMEOUT_MS = "45000"

# ===== جسر LMArena (اختياري) =====
# شغّل الخدمة من مجلد arena-bridge/ (Python + gpt4free/Arena + LMArenaBridge المحلي)
# ثم اضبط القيم هنا أو (الأفضل للأمان) عبر:
#   npx wrangler secret put ARENA_BRIDGE_URL
#   npx wrangler secret put ARENA_BRIDGE_KEY
# ملاحظة: الرابط بدون /v1 في النهاية — جارفس يضيف /v1/chat/completions بنفسه.
# ARENA_BRIDGE_URL = "https://arena-bridge.example.com"
# ARENA_BRIDGE_KEY = ""            # نفس BRIDGE_API_KEY بملف arena-bridge/.env
# ARENA_BRIDGE_MODEL = "auto"
# Arena أساسي تلقائياً بمجرد ضبط ARENA_BRIDGE_URL (وباقي المزودين احتياط).
# ARENA_BRIDGE_FIRST = "false"     # بدك ترجّع Gemini أول؟ حط false
# ARENA_BRIDGE_COOLDOWN_MS = "300000"  # مدة تجاهل الجسر بعد فشل متكرر
# ARENA_BRIDGE_TIMEOUT_MS = "45000"

[[kv_namespaces]]
binding = "JARVIS_KV"
id = "1bb9b81dde75449998d5afa33ded0302"

# Workers AI — ذكاء اصطناعي مجاني تاعي Cloudflare يتجدد يومياً (بدون مفتاح)
[ai]
binding = "AI"
