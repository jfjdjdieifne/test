<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>جارفس — المكالمة</title>
<style>
:root{--bg:#0b1220;--card:#131c30;--accent:#4fd1c5;--accent2:#7c5cff;--text:#e8ecf4;--muted:#8b94ad;--danger:#ff5c5c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%, #16224a 0%, var(--bg) 60%);color:var(--text);
  font-family:-apple-system,"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;height:100dvh;overflow:hidden;}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 16px 28px;position:relative;}
.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.avatar{width:148px;height:148px;border-radius:50%;display:grid;place-items:center;font-size:56px;
  background:radial-gradient(circle at 35% 30%, #243b6e, #131c30 75%);
  border:2px solid rgba(79,209,197,.35);position:relative;transition:box-shadow .35s;}
.avatar::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(79,209,197,.15);}
#avatar.speaking{box-shadow:0 0 0 6px rgba(79,209,197,.15),0 0 60px rgba(79,209,197,.35);}
#avatar.listening{box-shadow:0 0 0 6px rgba(124,92,255,.15),0 0 60px rgba(124,92,255,.35);}
h1{margin:14px 0 2px;font-size:26px;font-weight:700}
#status{color:var(--muted);font-size:14px;min-height:22px}
.panel{position:fixed;inset:auto 0 0 0;max-height:62%;background:var(--card);border-top:1px solid rgba(255,255,255,.07);
  border-radius:20px 20px 0 0;padding:14px 16px 90px;overflow:auto;transform:translateY(110%);transition:transform .3s;z-index:5}
.panel.open{transform:translateY(0)}
.panel h2{font-size:17px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
.panel .close{background:#1d2947;border:0;color:var(--text);border-radius:10px;padding:6px 12px;font-size:14px;cursor:pointer}
.panel img{max-width:100%;border-radius:12px;margin-top:6px}
.panel iframe{width:100%;height:300px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#fff}
.panel ul{padding:0 18px 0 0;line-height:2}
.panel .open-link{display:inline-block;margin-top:8px;background:var(--accent2);color:#fff;padding:8px 14px;border-radius:10px;text-decoration:none;font-size:13px}
.bar{display:flex;gap:10px;width:100%;max-width:520px}
.bar button{flex:1;background:var(--card);border:1px solid rgba(255,255,255,.07);color:var(--text);
  border-radius:16px;padding:12px 6px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;transition:.2s}
.bar button .ic{font-size:22px}
.bar button.on{background:#1d2947;border-color:var(--accent);box-shadow:0 0 14px rgba(79,209,197,.25)}
.bar button.warn.on{background:#2b1a20;border-color:var(--danger);box-shadow:0 0 14px rgba(255,92,92,.3)}
#join{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;padding:24px;text-align:center}
#joinBtn{background:linear-gradient(135deg,var(--accent),#38b2ac);color:#04231f;border:0;border-radius:18px;
  font-size:20px;font-weight:800;padding:18px 42px;cursor:pointer;box-shadow:0 10px 40px rgba(79,209,197,.35)}
#join p{color:var(--muted);max-width:320px;font-size:13px;line-height:1.9}
.err{color:#ffb4b4;font-size:13px;padding:0 20px;text-align:center}
</style>
</head>
<body>
<main id="call">
  <div class="brand"><span class="dot"></span> جارفس CEO — خط مباشر</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px">
    <div class="avatar" id="avatar">🎙️</div>
    <h1>جارفس</h1>
    <div id="status">يتصل…</div>
  </div>
  <div class="bar">
    <button id="btn-mic" class="on"><span class="ic">🎤</span>الميكروفون</button>
    <button id="btn-speaker" class="on warn-ignore"><span class="ic">🔊</span>صوت جارفس</button>
    <button id="btn-summary"><span class="ic">📝</span>الملخص</button>
  </div>
</main>

<div id="panel" class="panel" role="dialog" aria-modal="true">
  <h2><span id="panel-title">…</span><button class="close" id="panel-close">إغلاق ✕</button></h2>
  <div id="panel-body"></div>
</div>

<div id="join">
  <div style="font-size:64px">🎙️</div>
  <h1 style="margin:0">جارفس</h1>
  <p>مكالمة صوتية مباشرة مع مديرك التنفيذي — بدون فيديو، بدون تسجيل.</p>
  <button id="joinBtn">📲 اكبس للانضمام</button>
  <p class="err" id="join-err"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var LIVEKIT_URL = (params.get('liveKitUrl') || '').trim();
  var TOKEN = (params.get('token') || '').trim();
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status'), avatar = $('avatar');
  var micOn = true, speakerOn = true, gainNode = null, audioCtx = null;
  var panel = $('panel'), panelTitle = $('panel-title'), panelBody = $('panel-body');

  function setStatus(t) { statusEl.textContent = t; }
  function showPanel(title, html) { panelTitle.textContent = title || ''; panelBody.innerHTML = html || ''; panel.classList.add('open'); }
  function closePanel() { panel.classList.remove('open'); }
  $('panel-close').addEventListener('click', closePanel);

  function renderItem(item) {
    if (!item) return;
    if (item.kind === 'image') {
      showPanel(item.title || 'صورة',
        '<img src="' + esc(item.url) + '" alt="صورة">' + (item.caption ? '<p>' + esc(item.caption) + '</p>' : ''));
    } else if (item.kind === 'web') {
      var u = esc(item.url);
      showPanel(item.title || 'موقع',
        '<iframe src="' + u + '" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer"></iframe>' +
        '<a class="open-link" href="' + u + '" target="_blank" rel="noopener">🔗 افتح بشاشة كاملة</a>');
    } else if (item.kind === 'list') {
      var li = (item.items || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
      showPanel(item.title || 'قائمة', '<ul>' + li + '</ul>');
    } else if (item.kind === 'text') {
      showPanel(item.title || '', '<p style="line-height:2;white-space:pre-wrap">' + esc(item.text || '') + '</p>');
    }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setAgentVolume(v) {
    if (gainNode) { gainNode.gain.value = v; speakerOn = v > 0; $('btn-speaker').classList.toggle('on', speakerOn); }
  }

  var LK = window.LivekitClient || window.livekitClient || null;
  var room = null;

  async function connect() {
    if (!LK) { $('join-err').textContent = 'تعذر تحميل مكتبة الاتصال — تأكد من الإنترنت وجرب تاني.'; return; }
    if (!LIVEKIT_URL || !TOKEN) { $('join-err').textContent = 'الرابط ناقص (liveKitUrl/token) — اطلب رابط جديد من البوت.'; return; }
    try {
      $('join-err').textContent = '';
      setStatus('يتصل…');
      room = new LK.Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });

      room.on(LK.RoomEvent.TrackSubscribed, function (track) {
        if (track.kind !== 'audio') return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          var el = document.createElement('audio');
          el.autoplay = true; el.playsInline = true;
          el.srcObject = new MediaStream([track.mediaStreamTrack]);
          el.play().catch(function () {});
          var src = audioCtx.createMediaStreamSource(el.srcObject);
          gainNode = audioCtx.createGain();
          gainNode.gain.value = speakerOn ? 1 : 0;
          src.connect(gainNode); gainNode.connect(audioCtx.destination);
        } catch (e) { /* ربط الصوت فشل — جرّب تعيين الـ track مباشرة */ attachFallback(track); }
      });
      room.on(LK.RoomEvent.ActiveSpeakersChanged, function (speakers) {
        var me = room.localParticipant && room.localParticipant.identity;
        var agentSpeaking = speakers.some(function (s) { return s.identity !== me; });
        var meSpeaking = speakers.some(function (s) { return s.identity === me; });
        avatar.classList.toggle('speaking', !!agentSpeaking);
        avatar.classList.toggle('listening', !!meSpeaking && !agentSpeaking);
      });
      room.on(LK.RoomEvent.DataReceived, function (payload, participant, kind, topic) {
        if (topic && topic !== 'jarvis') return;
        try {
          var msg = JSON.parse(new TextDecoder().decode(payload));
          handleAgentMessage(msg);
        } catch (e) { /* رسالة ما هي لنا — تجاهل */ }
      });
      room.on(LK.RoomEvent.Disconnected, function () { setStatus('انقطعت — اكبس «انضمام» تاني'); });

      await room.connect(LIVEKIT_URL, TOKEN);
      try { await room.localParticipant.setMicrophoneEnabled(true); } catch (e) { /* بيرجع فيك بالأزرار */ }
      $('join').style.display = 'none';
      setStatus('متصل — احكي معي 🙂');
    } catch (e) {
      console.error(e);
      $('join-err').textContent = 'ما قدرت أدخل الغرفة — تأكد من الرابط وحاول تاني.';
    }
  }
  function attachFallback(track) {
    var el = document.createElement('audio');
    el.autoplay = true; el.srcObject = new MediaStream([track.mediaStreamTrack]);
    el.play().catch(function () {}); document.body.appendChild(el);
  }
  function handleAgentMessage(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'show') return renderItem(msg);
    if (msg.type === 'close_panel') return closePanel();
    if (msg.type === 'set_volume') return setAgentVolume(Number(msg.value) ? Number(msg.value) : 1);
    if (msg.type === 'summary') return showPanel('📝 الملخص', '<p style="line-height:2;white-space:pre-wrap">' + esc(msg.text) + '</p>');
  }

  $('joinBtn').addEventListener('click', connect);
  $('btn-mic').addEventListener('click', function () {
    micOn = !micOn;
    if (room && room.localParticipant) room.localParticipant.setMicrophoneEnabled(micOn).catch(function () {});
    this.classList.toggle('on', micOn);
    setStatus(micOn ? '🎤 الميكروفون مفتوح' : '🎤 الميكروفون مقفول — اكبس تاني للرجعة');
  });
  $('btn-speaker').addEventListener('click', function () { setAgentVolume(speakerOn ? 0 : 1); setStatus(speakerOn ? 'جارفس مسموع' : 'جارفس صايت — اكبس تاني في رجع'); });
  $('btn-summary').addEventListener('click', function () {
    if (room && room.localParticipant) {
      room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ type: 'summary_request' })), { reliable: true, topic: 'jarvis' });
      setStatus('📝 بنظر الملخص لحين يجهز…');
    }
  });
})();
</script>
</body>
</html>
